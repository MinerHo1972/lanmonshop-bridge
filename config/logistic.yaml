# 物流映射 — JKY 物流中文名 → 蓝盟中台物流编码
#
# 格式：JKY_logisticName → {platform_code, platform_name}
# platform_code = 蓝盟 syncOrderExpress 要求的 expressCode
# platform_name = 蓝盟 syncOrderExpress 要求的 expressName
#
# 来源：2026-07-07 用户提供蓝盟正式站物流编码表
# 2026-08-06 补充别名（JKY 实际返回 logisticName 变体）：
#   - "申通大件" → shentong（JKY 申通大件产品线，蓝盟无独立公司，归申通）
#   - "中通"     → zhongtong（JKY 返回简称）

logistic_mapping:
  "圆通速递": { platform_code: "yuantong", platform_name: "圆通速递" }
  "中通快递": { platform_code: "zhongtong", platform_name: "中通快递" }
  "中通":     { platform_code: "zhongtong", platform_name: "中通快递" }
  "韵达快递": { platform_code: "yunda", platform_name: "韵达快递" }
  "申通快递": { platform_code: "shentong", platform_name: "申通快递" }
  "申通大件": { platform_code: "shentong", platform_name: "申通快递" }
  "顺丰速运": { platform_code: "shunfeng", platform_name: "顺丰速运" }
  "顺丰":     { platform_code: "shunfeng", platform_name: "顺丰速运" }
  "邮政快递包裹": { platform_code: "youzhengguonei", platform_name: "邮政快递包裹" }
  "极兔速递": { platform_code: "jtexpress", platform_name: "极兔速递" }
  "京东物流": { platform_code: "jd", platform_name: "京东物流" }
  "EMS":      { platform_code: "ems", platform_name: "EMS" }
  "邮政电商标快": { platform_code: "youzhengdsbk", platform_name: "邮政电商标快" }

# 兜底处理：未匹配的物流公司
fallback:
  platform_code: "unknown"
  platform_name: "其他快递"
